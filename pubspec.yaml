name: entrixo
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  mobile_scanner: ^7.1.4
#  google_sign_in: ^6.1.6
  firebase_app_check: ^0.4.1+4
  shimmer: ^3.0.0
  flutter_svg: ^2.2.3
  flutter_riverpod: ^3.2.0
  device_info_plus: ^12.3.0
  shared_preferences: ^2.5.4
  qr_flutter: ^4.1.0
#  provider: ^6.1.5+1
#  carousel_slider: ^5.1.1
#  smooth_page_indicator: ^2.0.1
#  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
#  flutter_image_compress: ^2.4.0
#  path: ^1.9.1
#  package_info_plus: ^9.0.0
#  url_launcher: ^6.3.2
#  internet_connection_checker_plus: ^2.9.1+2
#  connectivity_plus: ^7.0.0
  in_app_update: ^4.2.5
  intl: ^0.20.2
#  firebase_messaging: ^16.1.1
#  flutter_local_notifications: ^17.2.2
#  cloud_functions: ^6.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: PoiretOne
      fonts:
        - asset: assets/fonts/PoiretOne-Regular.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.jpeg
  min_sdk_android: 23
  remove_alpha_ios: true

flutter_native_splash:
  color: "#111827"
  image: assets/icons/app_icon.jpeg
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true